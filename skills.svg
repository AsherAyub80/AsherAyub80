<svg width="900" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f0c29"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="900" height="160" rx="12" fill="url(#cardbg)"/>
  <rect width="900" height="160" rx="12" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.3"/>

  <!-- Section title -->
  <text x="30" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#a78bfa" letter-spacing="2">EXPERTISE LEVELS</text>

  <!-- Divider -->
  <line x1="30" y1="42" x2="870" y2="42" stroke="#a78bfa" stroke-width="0.4" opacity="0.3"/>

  <!-- Col 1 labels (left) -->
  <!-- Row 1: Flutter & Dart -->
  <text x="30" y="68" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e2e8f0">📱 Flutter &amp; Dart</text>
  <rect x="190" y="56" width="250" height="10" rx="5" fill="#1e1b4b" stroke="#a78bfa" stroke-width="0.4" opacity="0.5"/>
  <rect x="190" y="56" width="237" height="10" rx="5" fill="url(#bar1)"/>
  <text x="448" y="67" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#a78bfa" font-weight="700">95%</text>

  <!-- Row 2: Firebase & Supabase -->
  <text x="30" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e2e8f0">☁️  Firebase / Supabase</text>
  <rect x="190" y="80" width="250" height="10" rx="5" fill="#1e1b4b" stroke="#60a5fa" stroke-width="0.4" opacity="0.5"/>
  <rect x="190" y="80" width="220" height="10" rx="5" fill="url(#bar2)"/>
  <text x="448" y="91" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#60a5fa" font-weight="700">88%</text>

  <!-- Row 3: React / Next.js -->
  <text x="30" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e2e8f0">🌐 React / Next.js</text>
  <rect x="190" y="104" width="250" height="10" rx="5" fill="#1e1b4b" stroke="#34d399" stroke-width="0.4" opacity="0.5"/>
  <rect x="190" y="104" width="200" height="10" rx="5" fill="url(#bar3)"/>
  <text x="448" y="115" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#34d399" font-weight="700">80%</text>

  <!-- Row 4: Node / FastAPI -->
  <text x="30" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e2e8f0">⚙️  Node.js / FastAPI</text>
  <rect x="190" y="128" width="250" height="10" rx="5" fill="#1e1b4b" stroke="#fb923c" stroke-width="0.4" opacity="0.5"/>
  <rect x="190" y="128" width="185" height="10" rx="5" fill="url(#bar4)"/>
  <text x="448" y="139" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#fb923c" font-weight="700">74%</text>

  <!-- Vertical divider -->
  <line x1="490" y1="48" x2="490" y2="152" stroke="#a78bfa" stroke-width="0.4" opacity="0.2"/>

  <!-- Col 2 labels (right) -->
  <!-- Row 1: State Management -->
  <text x="510" y="68" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e2e8f0">🔄 State Management</text>
  <rect x="680" y="56" width="190" height="10" rx="5" fill="#1e1b4b" stroke="#a78bfa" stroke-width="0.4" opacity="0.5"/>
  <rect x="680" y="56" width="180" height="10" rx="5" fill="url(#bar1)"/>
  <text x="876" y="67" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#a78bfa" font-weight="700">95%</text>

  <!-- Row 2: REST APIs & Stripe -->
  <text x="510" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e2e8f0">🔌 REST APIs / Stripe</text>
  <rect x="680" y="80" width="190" height="10" rx="5" fill="#1e1b4b" stroke="#60a5fa" stroke-width="0.4" opacity="0.5"/>
  <rect x="680" y="80" width="165" height="10" rx="5" fill="url(#bar2)"/>
  <text x="876" y="91" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#60a5fa" font-weight="700">87%</text>

  <!-- Row 3: AI Tools -->
  <text x="510" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e2e8f0">🤖 AI-Assisted Dev</text>
  <rect x="680" y="104" width="190" height="10" rx="5" fill="#1e1b4b" stroke="#f472b6" stroke-width="0.4" opacity="0.5"/>
  <rect x="680" y="104" width="172" height="10" rx="5" fill="url(#bar5)"/>
  <text x="876" y="115" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#f472b6" font-weight="700">90%</text>

  <!-- Row 4: UI/UX & Design -->
  <text x="510" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#e2e8f0">🎨 UI / UX Polish</text>
  <rect x="680" y="128" width="190" height="10" rx="5" fill="#1e1b4b" stroke="#34d399" stroke-width="0.4" opacity="0.5"/>
  <rect x="680" y="128" width="152" height="10" rx="5" fill="url(#bar3)"/>
  <text x="876" y="139" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#34d399" font-weight="700">80%</text>
</svg>
